d_ff: 704
d_model: 256
decision_head:
  query_mode: entity_binding
  scorer: cosine
  state_attention: bidirectional
  temperature: 10.0
dropout: 0.0
max_seq_len: 2048
n_heads: 4
n_kv_heads: 2
n_layers: 8
name: s1-t256-flat8
optimizer:
  backbone_lr: 0.0003
  betas:
  - 0.9
  - 0.95
  decision_head_lr: 0.0003
  eps: 1.0e-08
  lr: 0.0003
  weight_decay: 0.01
pointer_dim: 128
rope_theta: 10000.0
safety:
  abort_on_nonfinite: true
  max_abs_logit: 100.0
  max_loss: 25.0
scheduler:
  type: cosine
  warmup_steps: 500
training:
  max_grad_norm: 1.0
vocab_size: 16000
