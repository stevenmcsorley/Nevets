name: s1-35m
vocab_size: 16000
d_model: 512
n_layers: 8
n_heads: 8
n_kv_heads: 4
d_ff: 1408
max_seq_len: 2048
rope_theta: 10000.0
dropout: 0.0
pointer_dim: 256
decision_head:
  scorer: cosine
  temperature: 10.0
  query_mode: entity_binding
  state_attention: bidirectional
optimizer:
  lr: 1.0e-05
  backbone_lr: 3.0e-05
  decision_head_lr: 0.0001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.01
scheduler:
  type: cosine
  warmup_steps: 100
training:
  max_grad_norm: 1.0
safety:
  max_loss: 25.0
  max_abs_logit: 100.0
  abort_on_nonfinite: true
arch:
  type: looped
  prelude: 2
  core: 4
  coda: 2
  iters: 4
