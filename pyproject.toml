[project]
name = "systemone-lab"
version = "0.1.0"
description = "Clean-room, from-scratch System-One/Jev-class decision model research lab"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "pyyaml>=6.0",
  "tokenizers>=0.20",
  "datasets>=3.0",
  "huggingface-hub>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "tqdm>=4.66",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
