[project]
name = "systemone-lab"
version = "0.1.0"
description = "Clean-room, from-scratch System-One/Jev-class decision model research lab"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "pyyaml>=6.0",
  "tokenizers>=0.20",
  "datasets>=3.0",
  "huggingface-hub>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "tqdm>=4.66",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
# PT pretraining. torch.compile needs Triton; Windows has no official build, so the community
# triton-windows wheel is pinned (see docs/ENVIRONMENT.md for the verified combination).
pt = ["pyarrow>=20", "pyahocorasick>=2.1", "triton-windows==3.5.1.post24; platform_system == 'Windows'"]
export = ["onnx>=1.17", "onnxruntime>=1.20", "chess>=1.11", "zstandard>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
